# HTTP only — separate IngressRoute required; Traefik does not route web when
# web + websecure + tls are combined in one IngressRoute (HTTP returns 404).
# Redirects to HTTPS so *Arr absolute http:// login Locations do not 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-http
  namespace: servarr
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/part-of: servarr-stack
  annotations:
    external-dns.alpha.kubernetes.io/hostname: radarr.lan
    external-dns.alpha.kubernetes.io/target: "192.168.68.62"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`radarr.lan`)
      kind: Rule
      middlewares:
        - name: lan-allowlist
          namespace: kube-system
        - name: redirect-https
      services:
        - name: radarr
          port: 7878
